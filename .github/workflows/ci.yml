name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: P0 required checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -m pip check
      - name: Verify package
        run: |
          python -m pip wheel --no-deps --wheel-dir /tmp/ameru-wheels .
          python -c "import app.main"
      - name: Ruff
        run: python -m ruff check .
      - name: Shell syntax
        run: bash -n .project-policy/git-guard .project-policy/install.sh .githooks/pre-push
      - name: Repository boundary
        run: python -m pytest tests/test_repository_boundary.py
      - name: Full test suite
        run: python -m pytest
